<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="assets/css/contact.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">M̌</div>
        <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-menu" aria-label="Primary navigation">
            <a href="index.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="experience.html">Experience</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-panel">
            <div class="contact-header">
                <h1>Contact Me!</h1>
                <p>If you want to collaborate, ask a question, or just say hello, send a message below and I will reply as soon as possible.</p>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <label for="message">Comment or message</label>
                    <textarea id="message" name="message" placeholder="Comment or message" required></textarea>
                </div>
                <div class="submit-row">
                    <button type="submit" class="submit-button">Submit</button>
                </div>
            </form>

        </section>
    </main>
    <script src="app/app.js" defer></script>
</body>

</html>
